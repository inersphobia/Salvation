    menuSync();
    haptic('light');
    playVoice(440, false, 0); // audition the level
  };
  document.getElementById('menuVol').appendChild(b);
});
btnMenu.onclick = () => {
  pulseButton(btnMenu, 'light');
  menuSync();
  menuEl.style.display = menuEl.style.display === 'block' ? 'none' : 'block';
};
document.getElementById('menuClose').addEventListener('click', () => { menuEl.style.display = 'none'; });

/* DEFAULT: restore the house settings (RINGS, 54 min, the E.PIANO ladder) */
const DEFAULT_PRESET = {
  view: 0,   // RINGS
  dur: 1,    // 54 MIN
  tones:  { t1620: 3, t540: 6, t180: 5, t60: 4, t20: 3, t6: 2, t2: 1 },  // HIGH, L>M>H, M>H, L>M, HIGH, MID, LOW
  voices: { t1620: 2, t540: 3, t180: 3, t60: 3, t20: 3, t6: 3, t2: 3 },  // ORGAN on 27, E.PIANO elsewhere
};
document.getElementById('menuDefault').addEventListener('click', () => {
  cycleMode = false;
  try { localStorage.setItem('salvationCycle', "0"); } catch(e) {}
  toneSel   = Object.assign({}, DEFAULT_PRESET.tones);
  toneVoice = Object.assign({}, DEFAULT_PRESET.voices);
  try {
    localStorage.setItem('salvationTones2', JSON.stringify(toneSel));
    localStorage.setItem('salvationVoices', JSON.stringify(toneVoice));
  } catch(e) {}
  tonePaints.forEach(p => p());
  triadFill = 0;
  try { localStorage.setItem('salvationTriadFill', "0"); } catch(e) {}
  triadKey = "";
  stackCounter = 0;
  try { localStorage.setItem('salvationStacks', "0"); } catch(e) {}
  fracDepth = 0;
  try { localStorage.setItem('salvationFracDepth', "0"); } catch(e) {}
  stageDark = 0;
  try { localStorage.setItem('salvationStage', "0"); } catch(e) {}
  starAdd = 0; starWhite = 0;
  try {
    localStorage.setItem('salvationStarAdd', "0");
    localStorage.setItem('salvationStarWhite', "0");
  } catch(e) {}
  gotoView(DEFAULT_PRESET.view);
  setDuration(DEFAULT_PRESET.dur); // duration stays reset-gated: no-op mid-session
  menuSync();
  haptic('medium');
});

document.getElementById('feSave').addEventListener('click', () => closeFrameEdit(true));
document.getElementById('feCancel').addEventListener('click', () => closeFrameEdit(false));

/* ---------- STATUS long-press: jump timer <-> its diagram ---------- */
function statusHit(cx, cy){
  if (viewMode === 2) return false;   // no status corner on the console
  if (cx > 250 || cy > 80) return false;
  return !!frameStatus || viewMode < 10; // placeholder is pressable too
}
let statusDown = null, statusPressTimer = null;
canvasAnim.addEventListener("pointerdown", (e) => {
  if (frameEdit.style.display === "block") return;
  const rect = canvasAnim.getBoundingClientRect();
  const cx = e.clientX - rect.left, cy = e.clientY - rect.top;
  if (!statusHit(cx, cy)) return;
  statusDown = { x: cx, y: cy };
  clearTimeout(statusPressTimer);
  statusPressTimer = setTimeout(() => {
    statusDown = null;
    if (isChart(viewMode)) gotoView(lastTimerView);       // diagram -> back to the timer
    else if (frameStatus) gotoView(10 + (frameSelectedF === 1 ? 1 : 0)); // timer -> status's diagram
    else gotoView(10);                                  // no status yet -> first diagram
    haptic('medium');
  }, 500);
});
canvasAnim.addEventListener("pointermove", (e) => {
  if (!statusDown) return;
  const rect = canvasAnim.getBoundingClientRect();
  if (Math.abs(e.clientX - rect.left - statusDown.x) +
      Math.abs(e.clientY - rect.top  - statusDown.y) > 10){
    clearTimeout(statusPressTimer);
    statusDown = null;
  }
});
canvasAnim.addEventListener("pointerup",     () => { clearTimeout(statusPressTimer); statusDown = null; });
canvasAnim.addEventListener("pointercancel", () => { clearTimeout(statusPressTimer); statusDown = null; });

/* ---------- PWA INSTALL PROMPT ---------- */
let deferredPrompt;
const installPrompt = document.getElementById('installPrompt');
const installBtn = document.getElementById('installBtn');
const dismissBtn = document.getElementById('dismissBtn');

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  installPrompt.style.display = 'block';
});

installBtn.addEventListener('click', async () => {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    deferredPrompt = null;
    installPrompt.style.display = 'none';
  }
});

dismissBtn.addEventListener('click', () => {
  installPrompt.style.display = 'none';
  deferredPrompt = null;
});

/* ---------- SERVICE WORKER REGISTRATION ---------- */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(reg => console.log('Service Worker registered'))
      .catch(err => console.log('Service Worker registration failed:', err));
  });

  // Notification action buttons (Pause/Reset) arrive as messages from the SW
  navigator.serviceWorker.addEventListener('message', (e) => {
    if (e.data === 'pause') pauseClock();
    else if (e.data === 'reset'){ if (!running) resetClock(); }
  });
}

/* ---------- ORIENTATION LOCK ---------- */
// Honored in the installed app; plain browser tabs reject it (harmless)
if (screen.orientation && screen.orientation.lock) {
  screen.orientation.lock('portrait').catch(() => {});
}

/* ---------- TRAVEL LIGHT WHEN THE LID CLOSES ---------- */
// Every cache here rebuilds itself in a frame or two. While the phone
// is locked they are only weight - and resident weight is what gets a
// background page killed. Drop them the moment the screen goes dark.
function abDropCaches(){
  try {
    abMonCache.clear(); abMonCanvas = null; abMonKey = "";
    abLetterCv = null; abLetterKey = "";
    abMonEOvCv = null; abMonEOvKey = "";
    abVizStaticCv = null; abVizStaticKey = "";
    cb3Cv = null; cb3Key = "";
    lnCv = null; lnKey = "";
    pnCv = null; pnKey = "";
    msCv = null; msHead = ""; msDrew = -1;
    msArt.key = ""; msArt.disc = []; msArt.dark = null;
    abVizLive.cv = null; abVizLive.key = "";
    abDgmCvs = [null, null];
  } catch(e) {}
}
window.addEventListener('pagehide', abDropCaches);

/* ---------- WAKE LOCK RE-ACQUIRE ON VISIBILITY CHANGE ---------- */
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'hidden'){
    abDropCaches();
    return;
  }
  if (document.visibilityState === 'visible'){
    needsStaticRedraw = true;
    if (running) await requestWakeLock();
  }
});

/* ---------- INIT ---------- */
// Ask the browser to treat this site's storage as durable: the user's
// rewritten ekphrases, orders, texts, and ledger must not be swept by
// storage-pressure eviction. Browsers grant this silently to installed
// PWAs; a denial changes nothing about how we store.
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e) {}

// Launcher shortcut deep links (?mode=27|54|81)
const modeParam = new URLSearchParams(location.search).get('mode');
const modeIdx = {"27": 0, "54": 1, "81": 2}[modeParam];
if (modeIdx !== undefined) {
  timeMode = modeIdx;
}

// Migrate: the two old empty boxes (indices 8,9) were replaced by ladders
try {
  const old = JSON.parse(localStorage.getItem('salvationFrameTexts') || "{}");
  if ("8" in old || "9" in old){
    delete old["8"]; delete old["9"];
    localStorage.setItem('salvationFrameTexts', JSON.stringify(old));
  }
  const oi = parseInt(localStorage.getItem('salvationStatusIdx'), 10);
  if (localStorage.getItem('salvationStatusF') !== "1" && oi >= 8){
    localStorage.removeItem('salvationStatusIdx');
  }
} catch(e) {}

// Restore custom box texts for both diagrams
try {
  for (let f = 0; f < FRAME_DEFS.length; f++){
    const map = JSON.parse(localStorage.getItem(FRAME_DEFS[f].store) || "{}");
    for (const k in map){
      const i = parseInt(k, 10);
      if (i >= 0 && i < FRAME_DEFS[f].boxes.length) setFrameBoxText(f, i, map[k], false);
    }
  }
} catch(e) {}

// THE SESSION SURVIVES THE PAGE: Android may kill a locked PWA to
// reclaim memory; the page dies but the wall clock does not. If a
// run is on record, pick the session up exactly where the wall says.
try {
  const R9 = JSON.parse(localStorage.getItem('salvationRun') || "null");
  if (R9 && R9.w > 0 && (Date.now() - R9.w) < 12*3600*1000){
    totalCycle = R9.tc || 27*60;
    timeMode = R9.tm || 0;
    if (R9.p > 0){
      pauseMs = R9.p;
      startMs = performance.now() - pauseMs;
      startWall = Date.now() - pauseMs;
      pauseWall = R9.pw || Date.now();
      running = false;
    } else {
      const el9 = (Date.now() - R9.w)/1000;
      startWall = R9.w;
      startMs = performance.now() - el9*1000;
      pauseMs = 0;
      running = true;
      // swallow the bells that rang while the page was dead
      for (const d of TONE_DEFS) lastToneIdx[d.id] = Math.floor(el9 / d.interval);
      lastBeepMinute = Math.floor(el9/60);
      requestWakeLock();
    }
    if (sessLog.length && sessLog[0] &&
        Math.abs((sessLog[0].at || 0) - R9.w) < 120000)
      curSess = sessLog[0];
    finished = false;
    needsStaticRedraw = true;
  } else if (R9){ localStorage.removeItem('salvationRun'); }
} catch(e) {}

// Restore last-used view and selected status
try {
  let savedView = parseInt(localStorage.getItem('salvationView'), 10);
  // Migrate: LEDGER slotted in at 7, pushing FRAME/GOAL to 8/9
  if (!localStorage.getItem('salvationViewMig10')){
    if (savedView >= 7){ savedView++; localStorage.setItem('salvationView', String(savedView)); }
    localStorage.setItem('salvationViewMig10', "1");
  }
  // Migrate: GOETIA slotted in at 8, pushing FRAME/GOAL to 9/10
  if (!localStorage.getItem('salvationViewMig11')){
    if (savedView >= 8){ savedView++; localStorage.setItem('salvationView', String(savedView)); }
    localStorage.setItem('salvationViewMig11', "1");
  }
  // Migrate: GEARS slotted in at 9, pushing FRAME/GOAL to 10/11
  if (!localStorage.getItem('salvationViewMig12')){
    if (savedView >= 9){ savedView++; localStorage.setItem('salvationView', String(savedView)); }
    localStorage.setItem('salvationViewMig12', "1");
  }
  if (savedView >= 0 && savedView < VIEW_NAMES.length){
    viewMode = savedView;
  }
  const savedStatus = localStorage.getItem('salvationStatus');
  if (savedStatus) frameStatus = savedStatus;
  const savedF = parseInt(localStorage.getItem('salvationStatusF'), 10);
  if (savedF === 0 || savedF === 1) frameSelectedF = savedF;
  const savedIdx = parseInt(localStorage.getItem('salvationStatusIdx'), 10);
  if (savedIdx >= 0 && savedIdx < FRAME_DEFS[frameSelectedF].boxes.length) frameSelected = savedIdx;
} catch(e) {}
if (isChart(viewMode)) frameHintUntil = performance.now() + 3000;

updateTables();
setupGeometry();
setupTriangles();
buildLedPaths();

centerColor=Array(numDials).fill("white");
centerSize =Array(numDials).fill(8);
glowAlpha =Array(numDials).fill(0);
updateTimerText(0);

// Draw static layer once on init
drawStaticLayer();

/* ---------- BUTTON HOOKS ---------- */
document.getElementById('btnExtend').onclick = ()=>{
  pulseButton(document.getElementById('btnExtend'));
  abacusExtend();
  haptic('medium');
};
btnReset.onclick = ()=>{
  // reset demands a stopped clock: pause first, then reset
  if (running || (!finished && pauseMs === 0)){ haptic('light'); return; }
  pulseButton(btnReset); requestReset();
};
btnPlay.onclick = ()=>{
  btnPlay.classList.add('pulse');
  setTimeout(()=>btnPlay.classList.remove('pulse'), 150);
  toggleClock();
};

requestAnimationFrame(draw);
</script>
